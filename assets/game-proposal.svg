<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Don't Look Twice game proposal</title>
  <desc id="desc">Layered pink and violet doorways surround a glowing acid-green light on a dark background.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="62%">
      <stop offset="0" stop-color="#e7ff4f"/>
      <stop offset="0.28" stop-color="#bed639" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#101112"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101112"/>
      <stop offset="0.7" stop-color="#12131a"/>
      <stop offset="1" stop-color="#1e1932"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#ground)"/>
  <circle cx="1180" cy="480" r="220" fill="#d9f247" opacity="0.28" filter="url(#softGlow)"/>
  <g stroke="#fff" stroke-opacity="0.74" stroke-width="3">
    <rect x="965" y="170" width="390" height="610" fill="#ff5c8a" opacity="0.75" transform="rotate(-6 1160 475)"/>
    <rect x="1010" y="145" width="390" height="610" fill="#7167ff" opacity="0.76" transform="rotate(5 1205 450)"/>
    <rect x="995" y="155" width="390" height="610" fill="url(#glow)"/>
  </g>
  <text x="90" y="100" fill="#e7ff4f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="4">INTERACTIVE NARRATIVE GAME PROPOSAL</text>
  <text x="85" y="650" fill="#f7b9cf" font-family="Arial, Helvetica, sans-serif" font-size="128" font-weight="800" letter-spacing="-7">DON'T LOOK</text>
  <text x="85" y="775" fill="#f7b9cf" font-family="Arial, Helvetica, sans-serif" font-size="128" font-weight="800" letter-spacing="-7">TWICE</text>
  <text x="92" y="825" fill="#ffffff" fill-opacity="0.68" font-family="Arial, Helvetica, sans-serif" font-size="28">What if the world changed whenever you stopped looking at it?</text>
  <line x1="90" y1="875" x2="1510" y2="875" stroke="#ffffff" stroke-opacity="0.22"/>
  <text x="92" y="920" fill="#ffffff" fill-opacity="0.5" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="3">PERCEPTION / MEMORY / MISSING EVIDENCE</text>
</svg>
