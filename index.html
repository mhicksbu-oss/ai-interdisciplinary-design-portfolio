<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A portfolio of selected creative work." />
    <title>AI for Interdisciplinary Design Portfolio — Marian</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="hero page-shell" aria-labelledby="page-title">

          <p class="hero__name">Marian</p>

        <div class="flower-field" aria-label="Interactive flower garden" role="group">
          <svg class="flower flower--one" viewBox="0 0 260 360" role="button" tabindex="0" aria-label="Grow a new flower">

          </svg>

            <path class="leaf" d="M130 225C96 193 67 200 54 217C80 236 105 240 130 225Z" />

              <ellipse cx="130" cy="107" rx="44" ry="83" transform="rotate(120 130 107)" />
              <ellipse cx="130" cy="107" rx="44" ry="83" transform="rotate(180 130 107)" />
              <ellipse cx="130" cy="107" rx="44" ry="83" transform="rotate(240 130 107)" />
              <ellipse cx="130" cy="107" rx="44" ry="83" transform="rotate(300 130 107)" />
              <circle class="flower-core" cx="130" cy="107" r="28" />
            </g>
          </svg>

          <svg class="flower flower--three" viewBox="0 0 260 360" role="button" tabindex="0" aria-label="Grow a new flower">
            <path class="stem" d="M129 350C126 292 139 229 129 171" />
            <path class="leaf" d="M129 257C159 226 186 231 200 246C176 263 152 268 129 257Z" />
            <g class="bloom">
              <ellipse cx="130" cy="108" rx="41" ry="80" />
              <ellipse cx="130" cy="108" rx="41" ry="80" transform="rotate(72 130 108)" />
              <ellipse cx="130" cy="108" rx="41" ry="80" transform="rotate(144 130 108)" />
              <ellipse cx="130" cy="108" rx="41" ry="80" transform="rotate(216 130 108)" />
              <ellipse cx="130" cy="108" rx="41" ry="80" transform="rotate(288 130 108)" />
              <circle class="flower-core" cx="130" cy="108" r="26" />
            </g>
          </svg>
        </div>
      </section>

      <section class="projects page-shell" aria-label="Selected projects">
        <article class="project-card">
          <div class="project-card__visual project-card__visual--cover">
            <a class="project-card__main-link" href="album-cover.html" aria-label="View the Album Cover project">
              <img class="project-card__main" src="assets/album-cover.png" alt="Finished pink album cover artwork" />
            </a>
          </div>
          <h2>Album Cover</h2>
        </article>

        <article class="project-card">
          <div class="project-card__visual project-card__visual--studio">
            <a class="project-card__main-link" href="studio-design.html" aria-label="View the Studio Design project">
              <img class="project-card__main" src="assets/studio-after.png" alt="Finished digital studio interior" />
            </a>
          </div>
          <h2>Studio Design</h2>
        </article>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
